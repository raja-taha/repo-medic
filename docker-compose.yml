services:
  postgres:
    image: postgres:16-alpine
    container_name: repomedic-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-repomedic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-repomedic_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-repomedic}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-repomedic} -d ${POSTGRES_DB:-repomedic}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: repomedic-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: repomedic-api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-repomedic}:${POSTGRES_PASSWORD:-repomedic_dev_password}@postgres:5432/${POSTGRES_DB:-repomedic}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-repomedic}:${POSTGRES_PASSWORD:-repomedic_dev_password}@postgres:5432/${POSTGRES_DB:-repomedic}
      REDIS_URL: redis://redis:6379/0
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./workspaces:/app/workspaces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    container_name: repomedic-worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-repomedic}:${POSTGRES_PASSWORD:-repomedic_dev_password}@postgres:5432/${POSTGRES_DB:-repomedic}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-repomedic}:${POSTGRES_PASSWORD:-repomedic_dev_password}@postgres:5432/${POSTGRES_DB:-repomedic}
      REDIS_URL: redis://redis:6379/0
      WORKSPACE_ROOT: /app/workspaces
    volumes:
      - ./workspaces:/app/workspaces
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    container_name: repomedic-web
    environment:
      # Browser → host-mapped API
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      # Next.js server components inside this container → compose DNS
      API_INTERNAL_BASE_URL: ${API_INTERNAL_BASE_URL:-http://api:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

  sandbox:
    build:
      context: ./services/sandbox
      dockerfile: Dockerfile
    image: repomedic-sandbox:latest
    profiles: ["build-sandbox"]

volumes:
  postgres_data:
  redis_data: