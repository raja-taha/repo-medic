[project]
name = "repomedic"
version = "0.1.0"
description = "Issue-to-Patch Software Engineering Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "psycopg2-binary>=2.9.10",
  "alembic>=1.14.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "redis>=5.2.0",
  "arq>=0.26.1",
  "httpx>=0.28.0",
  "PyGithub>=2.5.0",
  "openai>=1.57.0",
  "langgraph>=0.2.60",
  "langchain-openai>=0.2.14",
  "langchain-core>=0.3.28",
  "tree-sitter>=0.22.0",
  "tree-sitter-python>=0.23.0",
  "tree-sitter-typescript>=0.23.0",
  "docker>=7.1.0",
  "gitpython>=3.1.43",
  "python-multipart>=0.0.17",
  "tenacity>=9.0.0",
  "structlog>=24.4.0",
  "orjson>=3.10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.28.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["packages"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["packages", "apps/api", "services/worker"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict_optional = true